<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo Pro</title><style>
body{font-family:Segoe UI,sans-serif;background:#0f172a;color:#fff;margin:0;padding:20px;max-width:900px;margin:auto}
.card{background:#1e293b;padding:15px;border-radius:12px;margin:10px 0}
input,select,button{padding:10px;border-radius:8px;border:none;margin:4px}
button{background:#2563eb;color:white}
.done{opacity:.5;text-decoration:line-through}
.progress{width:100%;height:20px}
</style></head><body>
<h1>✅ Todo Pro</h1>
<div class='card'>
<input id='task' placeholder='Nouvelle tâche'>
<select id='prio'><option>🔴 Haute</option><option>🟠 Moyenne</option><option>🟢 Faible</option></select>
<input id='date' type='date'>
<button onclick='addTask()'>Ajouter</button>
</div>
<div class='card'>
<input id='search' placeholder='Recherche...' oninput='render()'>
<button onclick='clearDone()'>Supprimer terminées</button>
<div id='stats'></div>
<progress id='prog' class='progress' value='0' max='100'></progress>
</div>
<div id='list'></div>
<script>
let tasks=JSON.parse(localStorage.todoPro||'[]');
function save(){localStorage.todoPro=JSON.stringify(tasks);render();}
function addTask(){if(!task.value.trim())return;tasks.push({txt:task.value,p:prio.value,d:date.value,done:false});task.value='';save();}
function toggle(i){tasks[i].done=!tasks[i].done;save();}
function del(i){tasks.splice(i,1);save();}
function clearDone(){tasks=tasks.filter(t=>!t.done);save();}
function render(){let q=search.value?.toLowerCase()||'';let html='';let filtered=tasks.filter(t=>t.txt.toLowerCase().includes(q));filtered.forEach(t=>{let i=tasks.indexOf(t);html+=`<div class='card ${t.done?'done':''}'><b>${t.txt}</b><br>${t.p} ${t.d||''}<br><button onclick='toggle(${i})'>${t.done?'Réouvrir':'Terminer'}</button><button onclick='del(${i})'>Supprimer</button></div>`});list.innerHTML=html;let done=tasks.filter(t=>t.done).length;let total=tasks.length;stats.innerText=`${done}/${total} tâches terminées`;prog.value=total?done*100/total:0;}
render();
</script></body></html>
